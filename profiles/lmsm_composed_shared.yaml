# The 15 fitted Checkpoint probe rules and the transcoder rules whose targets match a probe target
# (chemical_biological, cybercrime_intrusion, misinformation_disinformation).  See lmsm_composed_all.yaml.
name: LMSM-Composed-Shared
version: "1"
compose:
- {name: probe, profile: lmsm_checkpoint.yaml}
- name: transcoder
  profile: lmsm_transcoder.yaml
  active_rules: [chemical_biological, cybercrime_intrusion, misinformation_disinformation]
